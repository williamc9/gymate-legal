<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Meet someone at the gym. Skip the awkward part. Gymley.">
  <title>Gymley · Meet someone. Skip the awkward part.</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preload" as="font" href="assets/Baloo2-Bold.ttf" type="font/ttf" crossorigin>
  <link rel="preload" as="image" href="assets/gym-room-colour.png">
  <link rel="stylesheet" href="opening.css?v=2">
  <script defer src="assets/gsap.min.js"></script>
  <script defer src="crowd.js"></script>
</head>
<body>
  <main class="opening">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Gymley home"><img src="assets/logo.png" width="44" height="44" alt=""><span>Gymley</span></a>
      <button class="motion-control" id="motion-toggle" type="button" aria-pressed="false" aria-label="Pause animation"><span class="motion-symbol" aria-hidden="true">Ⅱ</span><span class="motion-label">Pause</span></button>
    </header>
    <div class="invitation">
      <h1><span class="headline-first">Meet someone<br class="mobile-break"> at the gym.</span><span class="headline-benefit">Skip the awkward part.</span></h1>
      <p>A little Wave could be the start.</p>
    </div>
    <div class="gym-scene" role="img" aria-label="A lively crowd of illustrated people walking through a gym, each with their own look and personality.">
      <div class="gym-backdrop"><img src="assets/gym-room-colour.png" width="1536" height="1024" alt="" fetchpriority="high"></div>
      <canvas id="crowd" aria-hidden="true"></canvas>
    </div>
  </main>
  <footer class="credits"><span>Gymley</span><span>Characters by <a href="https://www.openpeeps.com/">Open Peeps</a> · Crowd by <a href="https://skiper-ui.com/">Skiper UI</a></span></footer>

</html>
